name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - v5

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lets Quartz use git history for "last modified" dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx quartz plugin install --from-config
      - run: npx quartz build
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_POND_0B4DE1A10 }}
          action: "upload"
          app_location: "public"   # the folder Quartz just built
          skip_app_build: true     # we've already built it above